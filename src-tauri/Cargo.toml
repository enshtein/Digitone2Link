[package]
name = "digitone2link"
version = "0.1.3"
description = "Digitone2Link desktop preset library"
authors = ["Digitone2Link contributors"]
edition = "2021"

[lib]
name = "digitone2link_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
midir = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
